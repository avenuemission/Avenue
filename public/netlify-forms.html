<!-- 
  This file contains hidden form definitions for Netlify Forms detection.
  Netlify scans static HTML at build time to detect form names.
  These forms are never displayed to users.
-->
<!DOCTYPE html>
<html>
<head>
  <title>Netlify Forms</title>
</head>
<body>
  <!-- Event Updates Form -->
  <form name="event-updates" netlify netlify-honeypot="website" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="website" />
  </form>

  <!-- Start Pathway Form -->
  <form name="start-pathway" netlify netlify-honeypot="website" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="suburb" />
    <input type="text" name="website" />
  </form>

  <!-- Join Pathway Form -->
  <form name="join-pathway" netlify netlify-honeypot="website" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="group" />
    <input type="text" name="website" />
  </form>

  <!-- Idea Submission Form -->
  <form name="idea-submission" netlify netlify-honeypot="website" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="idea"></textarea>
    <input type="text" name="website" />
  </form>

  <!-- APEST Results Form -->
  <form name="apest-results" netlify netlify-honeypot="website" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="apostle" />
    <input type="text" name="prophet" />
    <input type="text" name="evangelist" />
    <input type="text" name="shepherd" />
    <input type="text" name="teacher" />
    <input type="text" name="website" />
  </form>

  <!-- Leader Support Form -->
  <form name="leader-support" netlify netlify-honeypot="website" hidden>
    <input type="text" name="leaderName" />
    <input type="email" name="leaderEmail" />
    <input type="text" name="selectedDate" />
    <input type="text" name="website" />
  </form>

  <!-- Leader Support Custom Time Form -->
  <form name="leader-support-custom" netlify netlify-honeypot="website" hidden>
    <input type="text" name="leaderName" />
    <input type="email" name="leaderEmail" />
    <input type="text" name="requestedDate" />
    <input type="text" name="requestedTime" />
    <input type="text" name="website" />
  </form>

  <!-- Mission Support Form -->
  <form name="mission-support" netlify netlify-honeypot="website" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="supportType" />
    <textarea name="message"></textarea>
    <input type="text" name="website" />
  </form>
</body>
</html>
